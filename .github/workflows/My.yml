name: Optimized RDP + Tailscale + RustDesk (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:         { description: "Tailscale tailnet (e.g. you@gmail.com)", required: true }
      ts_api_key:         { description: "Tailscale API key (device admin, no Bearer)", required: true }
      ts_authkey:         { description: "Tailscale Auth key (reusable or ephemeral)", required: true }
      quick_test:         { description: "Run 5-minute test", type: boolean, default: false }
      runtime_minutes:    { description: "Runtime (max 360; default 355 when not test)", required: false, default: "355" }
      do_purge:           { description: "Purge bullet* devices at start (single instance only)", required: false, default: "true" }
      cycles:             { description: "0=stop after A; N=handoffs left incl this run", required: false, default: "0" }
      rdp_count:          { description: "How many RDP instances (1-10) [ignored if CRD provided]", required: false, default: "1" }
      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL containing --code="4/...".
          If provided -> single instance; CRD launches first.
        required: false
        default: ""
      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        default: "123456"
      rdp_user:
        description: "RDP username"
        required: false
        default: "RDPUser"
      rdp_pass:
        description: "RDP password (use a strong temporary password)"
        required: true
        default: ""

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:
      - id: mk
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            $n = 1
          } else {
            $n = [int]"${{ inputs.rdp_count }}"
            if ($n -lt 1) { $n = 1 }
            if ($n -gt 10) { $n = 10 }
          }

          $inc = @()
          for ($i = 1; $i -le $n; $i++) {
            $inc += @{ id = $i }
          }

          $json = @{ include = $inc } | ConvertTo-Json -Compress
          "matrix=$json" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $multi = if ($n -gt 1) { '1' } else { '0' }
          "multi=$multi" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: ${{ inputs.rdp_user }}
      RDP_PASS: ${{ inputs.rdp_pass }}

    steps:

      # ============================================================
      # CHROME REMOTE DESKTOP
      # ============================================================

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" | Out-File -Append $env:GITHUB_ENV
          } else {
            "CRD_ENABLED=0" | Out-File -Append $env:GITHUB_ENV
          }

          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"

      - name: Install Chrome Remote Desktop Host
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {
            Write-Host "Installing Chrome Remote Desktop..."

            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item $exePath -Force
              $ok = $true
            }
            catch {
              Write-Host "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {
              $msi = "$env:TEMP\chromeremotedesktophost.msi"

              try {
                Invoke-WebRequest `
                  -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile $msi `
                  -ErrorAction Stop

                Start-Process `
                  msiexec.exe `
                  -ArgumentList "/i","`"$msi`"","/quiet","/norestart" `
                  -Wait

                Remove-Item $msi -Force
              }
              catch {
                Write-Error "CRD installation failed: $($_.Exception.Message)"
                exit 1
              }
            }
          }
          else {
            Write-Host "CRD host already installed."
          }

      - name: Run Chrome Remote Desktop
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin = "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            Write-Error "crd_pin must be 6–12 digits."
            exit 1
          }

          $starter = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            Write-Error "remoting_start_host.exe not found."
            exit 1
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {
            $code = ([regex]::Match(
              $raw,
              '--code\s*=\s*"?([^"\s]+)'
            )).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {
            $redir = "https://remotedesktop.google.com/_/oauthredirect"
            $name = $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args
          }
          elseif ($isFull) {
            $tmp = "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            Write-Error "Could not detect CRD code."
            exit 1
          }

          Write-Host "CRD launch completed."

      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |
          $svcName = "Chrome Remote Desktop Service"
          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false

          while ((Get-Date) -lt $deadline) {
            $svc = Get-Service `
              -Name $svcName `
              -ErrorAction SilentlyContinue

            if ($svc -and $svc.Status -in 'Running','StartPending') {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "[$svcName] Running or starting."
          }
          else {
            Write-Warning "[$svcName] not running yet."
          }

          $logDir = "$env:ProgramData\Google\Chrome Remote Desktop"

          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter "host*.log" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {
                Write-Host "----- LOG: $($_.FullName) -----"
                Get-Content $_.FullName -Tail 200
              }
          }

      # ============================================================
      # HOSTNAME / RUNTIME
      # ============================================================

      - name: Decide hostname + runtime
        run: |
          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File -Append $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime = IntOr("${{ inputs.runtime_minutes }}",355)

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Hostname: $hn"
          Write-Host "Runtime: $runtime minutes"

      # ============================================================
      # WINDOWS 10 LIGHTWEIGHT OPTIMIZATION
      # ============================================================

      - name: Windows 10 lightweight optimization
        run: |
          Write-Host "========================================="
          Write-Host " Windows Lightweight RDP Optimization"
          Write-Host "========================================="

          # --------------------------------------------------------
          # HIGH PERFORMANCE POWER PLAN
          # --------------------------------------------------------

          $hp = powercfg /list |
            Select-String -Pattern "High performance"

          if ($hp -match '([0-9a-fA-F-]{36})') {
            powercfg /setactive $matches[1] 2>$null
            Write-Host "High Performance enabled."
          }

          # --------------------------------------------------------
          # DISABLE WINDOWS VISUAL EFFECTS
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name VisualFXSetting `
            -Type DWord `
            -Value 2

          # --------------------------------------------------------
          # DISABLE TRANSPARENCY
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name EnableTransparency `
            -Type DWord `
            -Value 0

          # --------------------------------------------------------
          # DISABLE WINDOW ANIMATIONS
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Control Panel\Desktop" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name MenuShowDelay `
            -Value "0"

          New-Item `
            "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop\WindowMetrics" `
            -Name MinAnimate `
            -Value "0"

          # --------------------------------------------------------
          # DISABLE TASKBAR / LIST ANIMATIONS
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name TaskbarAnimations `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name ListviewAlphaSelect `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name ListviewShadow `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # REDUCE EXPLORER DELAYS
          # --------------------------------------------------------

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" `
            -Name IconsOnly `
            -Type DWord `
            -Value 1 `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # DISABLE WINDOWS SEARCH INDEXING
          # --------------------------------------------------------

          $search = Get-Service `
            -Name WSearch `
            -ErrorAction SilentlyContinue

          if ($search) {
            Stop-Service `
              -Name WSearch `
              -Force `
              -ErrorAction SilentlyContinue

            Set-Service `
              -Name WSearch `
              -StartupType Disabled `
              -ErrorAction SilentlyContinue

            Write-Host "Search indexing disabled."
          }

          # --------------------------------------------------------
          # DISABLE OPTIONAL SERVICES
          # --------------------------------------------------------

          $services = @(
            "DiagTrack",
            "MapsBroker",
            "XblAuthManager",
            "XblGameSave",
            "XboxNetApiSvc",
            "XboxGipSvc"
          )

          foreach ($name in $services) {
            $svc = Get-Service `
              -Name $name `
              -ErrorAction SilentlyContinue

            if ($svc) {
              Stop-Service `
                -Name $name `
                -Force `
                -ErrorAction SilentlyContinue

              Set-Service `
                -Name $name `
                -StartupType Disabled `
                -ErrorAction SilentlyContinue

              Write-Host "$name disabled."
            }
          }

          # --------------------------------------------------------
          # STOP OPTIONAL BACKGROUND PROCESSES
          # --------------------------------------------------------

          foreach ($name in @(
      "OneDrive",
     "MicrosoftEdgeUpdate",
     "GoogleUpdate"
      )) {
            Get-Process `
              -Name $name `
              -ErrorAction SilentlyContinue |
              Stop-Process `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # DISABLE HIBERNATION
          # --------------------------------------------------------

          powercfg /hibernate off 2>$null

          # --------------------------------------------------------
          # PREVENT SLEEP / DISPLAY TIMEOUT
          # --------------------------------------------------------

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

          # --------------------------------------------------------
          # KEEP RDP ENABLED
          # --------------------------------------------------------

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Type DWord `
            -Value 0

          Write-Host "========================================="
          Write-Host " Lightweight optimization completed."
          Write-Host " Animations       : OFF"
          Write-Host " Transparency     : OFF"
          Write-Host " Search indexing  : OFF"
          Write-Host " Extra services   : REDUCED"
          Write-Host " Power plan       : HIGH PERFORMANCE"
          Write-Host "========================================="

      # ============================================================
      # PURGE TAILSCALE DEVICES
      # ============================================================

      - name: Purge bullet devices
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |
          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {
            try {
              $auth = [Convert]::ToBase64String(
                [Text.Encoding]::ASCII.GetBytes(
                  "${{ inputs.ts_api_key }}:"
                )
              )

              $tn = [uri]::EscapeDataString(
                "${{ inputs.ts_tailnet }}"
              )

              $list = Invoke-RestMethod `
                -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                -Headers @{
                  Authorization = "Basic $auth"
                }

              foreach ($d in $list.devices) {
                if ($d.hostname -match '^bullet[0-9]*$') {
                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host "Purged bullet devices."
            }
            catch {
              Write-Host "Purge warning: $($_.Exception.Message)"
            }
          }
          else {
            Write-Host "Purge disabled."
          }

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install + Up Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $dst = "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList "/i","`"$dst`"","/quiet","/norestart" `
              -Wait

            Remove-Item $dst -Force
          }

          & $ts logout | Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 = & $ts ip -4 |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"

      # ============================================================
      # RDP USER
      # ============================================================

      - name: Enable RDP user + firewall
        run: |
          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec = ConvertTo-SecureString `
            $p `
            -AsPlainText `
            -Force
      # ============================================================
      # KEEP ALIVE - ORIGINAL STYLE
      # ============================================================

      - name: Keep alive (to ${{ env.RUNTIME_MINUTES }} mins)
        run: |
          $mins = [int]"${{ env.RUNTIME_MINUTES }}"
          $end = (Get-Date).AddMinutes($mins)

          Write-Host "========================================="
          Write-Host "RDP KEEP ALIVE STARTED"
          Write-Host "Runtime: $mins minutes"
          Write-Host "End time: $($end.ToString('HH:mm:ss'))"
          Write-Host "========================================="

          while ((Get-Date) -lt $end) {

            # Keep important remote-desktop processes alive
            $rdpService = Get-Service `
              -Name TermService `
              -ErrorAction SilentlyContinue

            if ($rdpService -and $rdpService.Status -ne "Running") {
              Write-Host "TermService is not running - starting it..."
              Start-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue
            }

            # Make sure the RDP listener remains enabled
            Set-ItemProperty `
              "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
              -Name fDenyTSConnections `
              -Type DWord `
              -Value 0 `
              -ErrorAction SilentlyContinue

            # Keep Remote Desktop firewall rules enabled
            Enable-NetFirewallRule `
              -DisplayGroup "Remote Desktop" `
              -ErrorAction SilentlyContinue

            # Prevent the runner from going idle/sleeping
            powercfg /change standby-timeout-ac 0 2>$null
            powercfg /change monitor-timeout-ac 0 2>$null

            # Heartbeat
            $mode = if ("$env:CRD_ENABLED" -eq '1') {
              '[CRD+RustDesk/RDP]'
            }
            else {
              '[RustDesk/RDP]'
            }

            Write-Host (
              "$mode Heartbeat " +
              (Get-Date).ToString("HH:mm:ss") +
              " | Ends: " +
              $end.ToString("HH:mm:ss") +
              " | RDP: " +
              $rdpService.Status
            )

            Start-Sleep -Seconds 30
          }

          Write-Host "Runtime completed."
