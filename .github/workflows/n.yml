name: Optimized RDP + Tailscale + RustDesk (A)

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
        type: string

      ts_api_key:
        description: "Tailscale API key (device admin, no Bearer)"
        required: true
        type: string

      ts_authkey:
        description: "Tailscale Auth key (reusable or ephemeral)"
        required: true
        type: string

      quick_test:
        description: "Run 5-minute test"
        required: false
        type: boolean
        default: false

      runtime_minutes:
        description: "Runtime (max 360; default 355 when not test)"
        required: false
        type: string
        default: "355"

      do_purge:
        description: "Purge bullet* devices at start (single instance only)"
        required: false
        type: string
        default: "true"

      cycles:
        description: "0=stop after A; N=handoffs left incl this run"
        required: false
        type: string
        default: "0"

      rdp_count:
        description: "How many RDP instances (1-10) [ignored if CRD provided]"
        required: false
        type: string
        default: "1"

      crd_code:
        description: >-
          Paste raw CRD code (4/0AV...), full PowerShell command, or text/URL
          containing --code="4/...". If provided -> single instance; CRD launches first.
        required: false
        type: string
        default: ""

      crd_pin:
        description: "CRD PIN (6–12 digits). Used when launching CRD to avoid interactive prompt."
        required: false
        type: string
        default: "123456"

      rdp_user:
        description: "RDP username"
        required: false
        type: string
        default: "RDPUser"

      rdp_pass:
        description: "RDP password (use a strong temporary password)"
        required: true
        type: string
        default: ""

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:

  setup:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi: ${{ steps.mk.outputs.multi }}

    steps:
      - id: mk
        run: |
          # Safe literal read
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          # If CRD provided -> force single
          # Otherwise use rdp_count (1..10)
          if ($crd.Length -gt 0) {
            $n = 1
          }
          else {
            $n = [int]"${{ inputs.rdp_count }}"

            if ($n -lt 1) {
              $n = 1
            }

            if ($n -gt 10) {
              $n = 10
            }
          }

          $inc = @()

          for ($i = 1; $i -le $n; $i++) {
            $inc += @{ id = $i }
          }

          $json = @{ include = $inc } | ConvertTo-Json -Compress

          "matrix=$json" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

          $multi = if ($n -gt 1) { '1' } else { '0' }

          "multi=$multi" |
            Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8


  rdp:
    needs: setup
    runs-on: windows-latest

    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10

    timeout-minutes: 370

    env:
      RDP_USER: ${{ inputs.rdp_user }}
      RDP_PASS: ${{ inputs.rdp_pass }}

    steps:

      # ============================================================
      # CRD FIRST
      # ============================================================

      - name: Set CRD flag early
        run: |
          $crd = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          if ($crd.Length -gt 0) {
            "CRD_ENABLED=1" |
              Out-File -Append $env:GITHUB_ENV
          }
          else {
            "CRD_ENABLED=0" |
              Out-File -Append $env:GITHUB_ENV
          }

          Write-Host "CRD_ENABLED=$([int]($crd.Length -gt 0))"


      - name: Install Chrome Remote Desktop Host (if missing)
        if: env.CRD_ENABLED == '1'
        run: |
          $exe = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $exe)) {

            Write-Host "CRD host not found, attempting install..."

            $exePath = "$env:TEMP\chromeremotedesktophost.exe"
            $ok = $false

            try {
              Invoke-WebRequest `
                -Uri "https://dl.google.com/support/remote_assistance/ChromotingHostSetup.exe" `
                -OutFile $exePath `
                -ErrorAction Stop

              Start-Process `
                -FilePath $exePath `
                -ArgumentList "/silent","/install" `
                -Wait

              Remove-Item $exePath -Force

              $ok = $true
            }
            catch {
              Write-Host "EXE installer failed: $($_.Exception.Message)"
            }

            if (-not $ok) {

              $msi = "$env:TEMP\chromeremotedesktophost.msi"

              try {
                Invoke-WebRequest `
                  -Uri "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi" `
                  -OutFile $msi `
                  -ErrorAction Stop

                Start-Process `
                  msiexec.exe `
                  -ArgumentList "/i","`"$msi`"","/quiet","/norestart" `
                  -Wait

                Remove-Item $msi -Force
              }
              catch {
                Write-Error "CRD MSI fallback failed: $($_.Exception.Message)"
                exit 1
              }
            }

          }
          else {
            Write-Host "CRD host already installed."
          }


      - name: Run Chrome Remote Desktop with PIN
        if: env.CRD_ENABLED == '1'
        run: |
          $raw = @'
          ${{ inputs.crd_code }}
          '@.Trim()

          $pin = "${{ inputs.crd_pin }}".Trim()

          if ($pin -notmatch '^\d{6,12}$') {
            Write-Error "crd_pin must be 6–12 digits."
            exit 1
          }

          $starter =
            "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"

          if (-not (Test-Path $starter)) {
            Write-Error "remoting_start_host.exe not found."
            exit 1
          }

          $isFull = $false
          $code = $null

          if ($raw -match 'remoting_start_host\.exe') {
            $isFull = $true
          }

          if ($raw -match '--code\s*=\s*"?([^"\s]+)') {
            $code =
              ([regex]::Match(
                $raw,
                '--code\s*=\s*"?([^"\s]+)'
              )).Groups[1].Value
          }
          elseif ($raw -match '^4\/') {
            $code = $raw
          }

          if ($code) {

            $redir =
              "https://remotedesktop.google.com/_/oauthredirect"

            $name = $Env:COMPUTERNAME

            $args = @(
              "--code=""$code""",
              "--redirect-url=""$redir""",
              "--name=""$name""",
              "--pin=""$pin"""
            )

            Start-Process `
              -FilePath $starter `
              -ArgumentList $args
          }
          elseif ($isFull) {

            $tmp = "$env:TEMP\crd_full.ps1"

            Set-Content `
              -Path $tmp `
              -Value $raw `
              -Encoding UTF8

            powershell `
              -ExecutionPolicy Bypass `
              -File $tmp
          }
          else {
            Write-Error "Could not detect CRD code."
            exit 1
          }

          Write-Host "CRD launch step completed."


      - name: Verify CRD registration
        if: env.CRD_ENABLED == '1'
        run: |
          $svcName = "Chrome Remote Desktop Service"

          $deadline = (Get-Date).AddSeconds(60)

          $ok = $false

          while ((Get-Date) -lt $deadline) {

            $svc = Get-Service `
              -Name $svcName `
              -ErrorAction SilentlyContinue

            if ($svc -and $svc.Status -in 'Running','StartPending') {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 3
          }

          if ($ok) {
            Write-Host "[$svcName] status: Running or starting."
          }
          else {
            Write-Warning "[$svcName] not running yet."
          }

          $logDir =
            "$env:ProgramData\Google\Chrome Remote Desktop"

          if (Test-Path $logDir) {

            Get-ChildItem $logDir `
              -Filter "host*.log" |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 |
              ForEach-Object {

                Write-Host "----- LOG: $($_.FullName) -----"

                Get-Content `
                  $_.FullName `
                  -Tail 200
              }
          }
          else {
            Write-Host "CRD log directory not found."
          }


      # ============================================================
      # HOSTNAME + RUNTIME
      # ============================================================

      - name: Decide hostname + runtime
        run: |

          if ("${{ inputs.rdp_count }}" -gt 1) {
            $hn = "bullet${{ matrix.id }}"
          }
          else {
            $hn = "bullet"
          }

          "TS_HOSTNAME=$hn" |
            Out-File -Append $env:GITHUB_ENV

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          function IntOr($v,$d) {
            if ("$v" -match '^\d+$') {
              [int]$v
            }
            else {
              [int]$d
            }
          }

          $runtime =
            IntOr("${{ inputs.runtime_minutes }}",355)

          if (Yes("${{ inputs.quick_test }}")) {
            $runtime = 5
          }

          if (
            -not (Yes("${{ inputs.quick_test }}")) -and
            $runtime -lt 6
          ) {
            $runtime = 355
          }

          if ($runtime -gt 360) {
            $runtime = 355
          }

          "RUNTIME_MINUTES=$runtime" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Hostname: $hn"
          Write-Host "Runtime: $runtime"


      # ============================================================
      # LOW-END RDP OPTIMIZATION
      # ============================================================

      - name: Optimize Windows for low-end RDP
        run: |

          Write-Host "Applying low-resource Windows/RDP optimizations..."

          # --------------------------------------------------------
          # HIGH PERFORMANCE POWER PLAN
          # --------------------------------------------------------

          $hp =
            powercfg /list |
            Select-String -Pattern "High performance"

          if ($hp -match '([0-9a-fA-F-]{36})') {

            powercfg /setactive $matches[1] 2>$null

            Write-Host "High Performance power plan selected."
          }

          # --------------------------------------------------------
          # DISABLE WINDOWS VISUAL EFFECTS
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" `
            -Name VisualFXSetting `
            -Type DWord `
            -Value 2 `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # DISABLE TRANSPARENCY
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            -Name EnableTransparency `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # DISABLE UI ANIMATION / DELAYS
          # --------------------------------------------------------

          New-Item `
            "HKCU:\Control Panel\Desktop" `
            -Force |
            Out-Null

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name MenuShowDelay `
            -Value "0" `
            -ErrorAction SilentlyContinue

          Set-ItemProperty `
            "HKCU:\Control Panel\Desktop" `
            -Name AutoEndTasks `
            -Value "1" `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # DISABLE SEARCH INDEXING
          # --------------------------------------------------------

          $svc = Get-Service `
            WSearch `
            -ErrorAction SilentlyContinue

          if ($svc) {

            Stop-Service `
              WSearch `
              -Force `
              -ErrorAction SilentlyContinue

            Set-Service `
              WSearch `
              -StartupType Disabled `
              -ErrorAction SilentlyContinue
          }

          # --------------------------------------------------------
          # DISABLE OPTIONAL BACKGROUND SERVICES
          # --------------------------------------------------------

          foreach ($name in @(
            "DiagTrack",
            "MapsBroker",
            "XblAuthManager",
            "XblGameSave",
            "XboxNetApiSvc",
            "XboxGipSvc"
          )) {

            $s = Get-Service `
              $name `
              -ErrorAction SilentlyContinue

            if ($s) {

              Stop-Service `
                $name `
                -Force `
                -ErrorAction SilentlyContinue

              Set-Service `
                $name `
                -StartupType Disabled `
                -ErrorAction SilentlyContinue
            }
          }

          # --------------------------------------------------------
          # DISABLE HIBERNATION
          # --------------------------------------------------------

          powercfg /hibernate off 2>$null

          # --------------------------------------------------------
          # KEEP RDP ENABLED
          # --------------------------------------------------------

          Set-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Type DWord `
            -Value 0 `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # DISABLE SLEEP / DISPLAY TIMEOUT
          # --------------------------------------------------------

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0

          Write-Host "Low-end optimization complete."


      # ============================================================
      # PURGE TAILSCALE DEVICES
      # ============================================================

      - name: Purge bullet* devices (single-instance only)
        if: ${{ needs.setup.outputs.multi == '0' }}
        run: |

          function Yes($v) {
            "$v" -match '^(?i:true|1|yes|on)$'
          }

          if (Yes("${{ inputs.do_purge }}")) {

            try {

              $auth =
                [Convert]::ToBase64String(
                  [Text.Encoding]::ASCII.GetBytes(
                    "${{ inputs.ts_api_key }}:"
                  )
                )

              $tn =
                [uri]::EscapeDataString(
                  "${{ inputs.ts_tailnet }}"
                )

              $list =
                Invoke-RestMethod `
                  -Uri "https://api.tailscale.com/api/v2/tailnet/$tn/devices" `
                  -Headers @{
                    Authorization = "Basic $auth"
                  }

              foreach ($d in $list.devices) {

                if ($d.hostname -match '^bullet[0-9]*$') {

                  Invoke-RestMethod `
                    -Method Delete `
                    -Uri "https://api.tailscale.com/api/v2/device/$($d.id)" `
                    -Headers @{
                      Authorization = "Basic $auth"
                    } `
                    -ErrorAction SilentlyContinue
                }
              }

              Write-Host "Purged bullet* devices if present."
            }
            catch {
              Write-Host "Purge warning: $($_.Exception.Message)"
            }
          }
          else {
            Write-Host "Purge disabled."
          }


      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Install + Up Tailscale
        run: |

          $ts =
            "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {

            $url =
              "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

            $dst =
              "$env:TEMP\tailscale.msi"

            Invoke-WebRequest `
              -Uri $url `
              -OutFile $dst

            Start-Process `
              msiexec.exe `
              -ArgumentList "/i","`"$dst`"","/quiet","/norestart" `
              -Wait

            Remove-Item `
              $dst `
              -Force
          }

          & $ts logout | Out-Null

          & $ts up `
            --authkey "${{ inputs.ts_authkey }}" `
            --hostname "$env:TS_HOSTNAME" `
            --accept-dns=true `
            --accept-routes=true

          $ip4 =
            & $ts ip -4 |
            Select-Object -First 1

          "TAILSCALE_IP=$ip4" |
            Out-File -Append $env:GITHUB_ENV

          Write-Host "Tailscale IPv4: $ip4"


      # ============================================================
      # RDP USER
      # ============================================================

      - name: Enable RDP user + firewall
        run: |

          $u = $env:RDP_USER
          $p = $env:RDP_PASS

          $sec =
            ConvertTo-SecureString `
              $p `
              -AsPlainText `
              -Force

          if (-not (
            Get-LocalUser `
              -Name $u `
              -ErrorAction SilentlyContinue
          )) {

            New-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u
          }
          else {

            Set-LocalUser `
              -Name $u `
              -Password $sec `
              -AccountNeverExpires

            Enable-LocalUser `
              -Name $u

            Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $u `
              -ErrorAction SilentlyContinue

            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $u `
              -ErrorAction SilentlyContinue
          }

          Set-ItemProperty `
            "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections `
            -Value 0 `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."
          Write-Host "Host: $env:TS_HOSTNAME"
          Write-Host "IP: $env:TAILSCALE_IP"


      # ============================================================
      # 
